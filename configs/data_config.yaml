# ==============================================================================
# КОНФИГУРАЦИЯ СБОРА И ПЕРВИЧНОЙ ФИЛЬТРАЦИИ ДАННЫХ (Materials Project)
# Организация: Самарский государственный технический университет (СамГТУ)
# Тема: Машинное обучение и компьютерное моделирование в скрининге бетавольтаических полупроводников
# ==============================================================================

# Фильтры первичного отсева при запросе к Materials Project API
screening_filters:
  # Ширина запрещенной зоны (эВ):
  # min = 0.1 эВ (отсекаем бесщелевые полупроводники, металлы и полуметаллы без p-n перехода)
  # max = 8.0 эВ (отсекаем глубокие диэлектрики, где генерация/сбор пар неэффективны)
  min_band_gap: 0.1
  max_band_gap: 8.0

  # Термодинамическая стабильность (эВ/атом):
  # Расстояние до выпуклой термодинамической оболочки (energy_above_hull).
  # 0.0 — абсолютно стабильная фаза; <= 0.05 эВ/атом — допустимая метастабильность при н.у.
  max_energy_above_hull: 0.05

  # Ограничение по максимальному числу атомов в примитивной ячейке (для вычислимости)
  max_num_sites: 50

# «Черный список» химических элементов (Blacklist):
# Полупроводник НЕ должен содержать:
# 1. Радиоактивные актиниды и тяжелые металлы (чтобы не путать с излучением изотопа источника)
# 2. Инертные/благородные газы (не образующие твердых кристаллов при н.у.)
# 3. Высокотоксичные летучие элементы
blacklist_elements:
  - He
  - Ne
  - Ar
  - Kr
  - Xe
  - Rn
  - Tc
  - Pm  # Прометрий исключен из состава полупроводника (он используется только как источник)
  - Po
  - At
  - Fr
  - Ra
  - Ac
  - Th
  - Pa
  - U
  - Np
  - Pu
  - Am
  - Cm
  - Bk
  - Cf
  - Es
  - Fm
  - Md
  - No
  - Lr
  - Hg  # Ртуть: высокое давление паров при 300K, токсичность
  - Tl  # Таллий: крайняя токсичность, летучие оксиды

# Список скачиваемых полей кристаллической структуры и свойств через mp-api
# Включает расширенный набор характеристик для глубокого анализа в Jupyter-ноутбуках
requested_fields:
  - material_id
  - formula_pretty
  - composition
  - structure
  - symmetry
  - band_gap
  - is_gap_direct
  - is_metal
  - is_stable
  - theoretical
  - database_IDs
  - density
  - volume
  - nsites
  - energy_per_atom
  - energy_above_hull
  - formation_energy_per_atom
  - total_magnetization
  - is_magnetic
  - ordering
  - cbm
  - vbm
  - efermi
  - bulk_modulus
  - shear_modulus
  - chemsys
  - elements
  - nelements

# Настройки кэширования и путей сохранения
storage:
  raw_data_dir: "data/01_raw"
  intermediate_dir: "data/02_intermediate"
  raw_filename: "materials_project_raw.parquet"
  cleaned_filename: "semiconductors_cleaned.parquet"
  ground_state_filename: "semiconductors_unique_ground.parquet"
