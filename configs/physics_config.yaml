# ==============================================================================
# КОНФИГУРАЦИЯ ФИЗИКО-МАТЕМАТИЧЕСКИХ МОДЕЛЕЙ И ИЗОТОПОВ
# Организация: Самарский государственный технический университет (СамГТУ)
# Соответствие стандартам: NIST ESTAR, CODATA 2022, ГОСТ 7.0.5-2008
# ==============================================================================

# Фундаментальные физические константы (CODATA 2022)
constants:
  q: 1.602176634e-19          # Элементарный заряд электрона, Кл
  k_B: 1.380649e-23           # Постоянная Больцмана, Дж/К
  k_B_eV: 8.617333262e-5      # Постоянная Больцмана, эВ/К
  c: 299792458.0              # Скорость света в вакууме, м/с
  m_e: 9.1093837015e-31       # Масса покоя электрона, кг
  m_e_keV: 510.99895          # Энергия покоя электрона m_e*c^2, кэВ
  eps_0: 8.8541878128e-12     # Электрическая постоянная (диэлектрическая проницаемость вакуума), Ф/м
  u: 1.66053906660e-27        # Атомная единица массы (а.е.м.), кг

# Условия окружающей среды и работы преобразователя
operating_conditions:
  temperature_kelvin: 300.0   # Комнатная рабочая температура, К
  diode_ideality_factor: 1.2  # Идеалити-фактор p-n/Schottky диода в микротоковом режиме (n)

# Радиоактивные бета-активные изотопы (источники излучения)
isotopes:
  Ni-63:
    name: "Никель-63"
    symbol: "63Ni"
    half_life_years: 100.1
    half_life_seconds: 3.159e9
    mean_energy_keV: 17.4
    max_energy_keV: 66.9
    specific_activity_TBq_g: 2.1
    density_g_cm3: 8.90
    decay_type: "pure_beta_minus"
    safety_notes: "Металлическое гальваническое покрытие. Нет газовыделения. Взрывобезопасен."

  H-3:
    name: "Тритий"
    symbol: "3H"
    half_life_years: 12.32
    half_life_seconds: 3.888e8
    mean_energy_keV: 5.7
    max_energy_keV: 18.6
    specific_activity_TBq_g: 357.0
    density_g_cm3: 0.00018  # В виде газа; в тритидах металлов TiT2 плотность матрицы ~3.9 г/см3
    decay_type: "pure_beta_minus"
    safety_notes: "Требует связывания в матрицах титана (TiT2) или скандия (ScT2) для исключения давления газа He-3."

  C-14:
    name: "Углерод-14"
    symbol: "14C"
    half_life_years: 5730.0
    half_life_seconds: 1.808e11
    mean_energy_keV: 49.5
    max_energy_keV: 156.5
    specific_activity_TBq_g: 0.165
    density_g_cm3: 3.51   # Алмазная форма C-14
    decay_type: "pure_beta_minus"
    safety_notes: "Внедрение в кристаллическую решетку синтетического алмаза. Экстремальная химическая и термическая стойкость."

  Pm-147:
    name: "Прометрий-147"
    symbol: "147Pm"
    half_life_years: 2.62
    half_life_seconds: 8.268e7
    mean_energy_keV: 62.0
    max_energy_keV: 224.1
    specific_activity_TBq_g: 34.3
    density_g_cm3: 7.26   # Оксид прометрия Pm2O3
    decay_type: "beta_minus_low_gamma"
    safety_notes: "Высокая удельная мощность, керамическая стабильность оксида Pm2O3. Требует радиационного экранирования."

# Коэффициенты эмпирических и полуэмпирических уравнений
models:
  # Правило Кляйна: eps_ehp = a * E_g + b (энергия образования электронно-дырочной пары)
  klein_rule:
    coefficient_a: 2.8
    constant_b_eV: 0.55

  # Уравнение пробега электронов Фельдмана: R (мкм) = (c_f * E^alpha) / rho
  feldman_range:
    constant_c: 0.04          # Коэффициент Фельдмана
    energy_power: 1.75        # Показатель степени энергии (E в кэВ)
    safety_absorption_factor: 3.0 # Рекомендуемый множитель толщины полупроводника (3*R_max) для 99% поглощения

  # Модель порога радиационного дефектообразования (смещения атомов) Ван-Вехтена:
  # E_d = d_0 + d_1 * E_g + d_2 * E_coh + d_3 * T_m
  van_vechten_displacement:
    d_0: 8.0                  # Базовый сдвиг, эВ
    d_1: 1.8                  # Вклад ширины запрещенной зоны
    d_2: 2.0                  # Вклад энергии когезии решетки
    d_3: 0.002                # Вклад температуры плавления (К)
